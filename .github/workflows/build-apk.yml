name: Build & Auto Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check and Configure Release
        id: prep
        run: |
          # Fetch all tags from remote repository to ensure accurate tag checking
          git fetch --tags --force
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Triggered by manual tag: $TAG_NAME"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | tr -d '"' | awk '{print $3}')
            TAG_NAME="v$VERSION_NAME"
            echo "Triggered by branch push. Version in gradle is: $VERSION_NAME (tag: $TAG_NAME)"
            
            if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME does not exist on remote. Automatically generating and pushing tag..."
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG_NAME"
              git push origin "$TAG_NAME"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG_NAME already exists on remote. Skipping release generation."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build Android App
        run: |
          # Generate dummy .env file if it does not exist
          echo "GEMINI_API_KEY=AIzaSyFakeKey_Placeholder" > .env
          echo "Successfully initialized temporary .env file."

          # Write key configs for secrets gradle plug-in
          echo "GEMINI_API_KEY=AIzaSyFakeKey_Placeholder" > .env
          
          # Decode debug keystore base64
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "No debug.keystore.base64 found. Creating a fresh temporary layout..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p build-output

          # If release is triggered or a new tag is pushed/configured, build release APK
          if [[ "${{ steps.prep.outputs.should_release }}" == "true" ]]; then
            echo "Building production release APK for Tag: ${{ steps.prep.outputs.tag_name }}..."
            gradle :app:assembleRelease --no-daemon
            
            RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
            if [ -n "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" build-output/app-release.apk
              echo "Successfully copied release APK: $RELEASE_APK to build-output/app-release.apk"
            else
              echo "Error: Release APK not found. Falling back to build debug mode."
              gradle :app:assembleDebug --no-daemon
              cp app/build/outputs/apk/debug/*.apk build-output/app-release.apk
            fi
          else
            echo "Normal branch build: Compiling Debug APK."
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk build-output/app-debug.apk
          fi

      - name: Create or Update GitHub Release
        if: steps.prep.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/app-release.apk
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: Release ${{ steps.prep.outputs.tag_name }}
          body: |
            ## Bản cập nhật ${{ steps.prep.outputs.tag_name }}
            
            Ứng dụng của bạn đã sẵn sàng với phiên bản ${{ steps.prep.outputs.tag_name }}.
            
            ### Cách cài đặt:
            1. Tải tệp `app-release.apk` bên dưới.
            2. Mở tệp để nâng cấp trực tiếp trên thiết bị Android của bạn.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version.json & Push to GitHub raw path
        if: steps.prep.outputs.should_release == 'true'
        run: |
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | awk '{print $3}')
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | tr -d '"' | awk '{print $3}')
          TAG_NAME="${{ steps.prep.outputs.tag_name }}"
          
          if [[ "$TAG_NAME" =~ ^v[0-9] ]]; then
            VERSION_NAME="${TAG_NAME#v}"
          fi
          
          echo "Generated version configuration: Code=$VERSION_CODE, Name=$VERSION_NAME for tag $TAG_NAME"
          
          # Create JSON file matching the standard Auto-Update schema
          echo "{" > version.json
          echo "  \"versionCode\": $VERSION_CODE," >> version.json
          echo "  \"versionName\": \"$VERSION_NAME\"," >> version.json
          echo "  \"apkUrl\": \"https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/app-release.apk\"," >> version.json
          echo "  \"forceUpdate\": false," >> version.json
          echo "  \"changelog\": \"Cập nhật ứng dụng lên phiên bản mới $VERSION_NAME. Cải thiện hiệu suất, tối ưu hóa bộ nhớ và sửa lỗi.\"" >> version.json
          echo "}" >> version.json
          
          # Commit the updated version.json back to default branch
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          echo "Auto-detected default branch: $DEFAULT_BRANCH"
          
          git fetch origin $DEFAULT_BRANCH
          git checkout $DEFAULT_BRANCH
          git pull origin $DEFAULT_BRANCH
          
          git add version.json
          git commit -m "chore: auto-update version.json to match $TAG_NAME" || echo "No modifications to commit"
          git push origin $DEFAULT_BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
