name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          # Tư duy tự động dò tìm thư mục gốc Gradle (tránh lỗi cấu trúc thư mục lồng nhau)
          GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "Tìm thấy dự án Gradle tại: $GRADLE_ROOT"
          cd "$GRADLE_ROOT"
          gradle :app:assembleDebug --no-daemon
          cd -
          mkdir -p build-output
          cp "$GRADLE_ROOT"/app/build/outputs/apk/debug/app-debug.apk build-output/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GestureQuest-Arena-Debug-APK
          path: build-output/app-debug.apk
