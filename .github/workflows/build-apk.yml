name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          # Tạo tệp .env chứa khóa giả lập để xây dựng ứng dụng thành công
          echo "GEMINI_API_KEY=AIzaSyFakeKey_Placeholder" > .env
          echo "Đã khởi tạo thành công tệp .env tạm thời."

          # Tìm kiếm tệp cấu hình Gradle một cách an toàn, tránh lỗi xargs khi không tìm thấy
          GRADLE_FILE=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            GRADLE_ROOT=$(dirname "$GRADLE_FILE")
            echo "Tìm thấy dự án Gradle tại thư mục: $GRADLE_ROOT"
            cd "$GRADLE_ROOT"
            # Đảm bảo .env nằm đúng thư mục gốc Gradle
            echo "GEMINI_API_KEY=AIzaSyFakeKey_Placeholder" > .env
            
            # Giải mã debug.keystore từ base64
            if [ -f "debug.keystore.base64" ]; then
              echo "Phát hiện debug.keystore.base64, đang giải mã..."
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -f "../debug.keystore.base64" ]; then
              echo "Phát hiện debug.keystore.base64 ở thư mục cha, đang giải mã..."
              base64 -d ../debug.keystore.base64 > debug.keystore
            else
              echo "Không tìm thấy debug.keystore.base64. Đang tự động tạo debug.keystore mới..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi

            gradle :app:assembleDebug --no-daemon
            cd -
            mkdir -p build-output
            cp "$GRADLE_ROOT"/app/build/outputs/apk/debug/app-debug.apk build-output/
          else
            echo "Lỗi: Không tìm thấy tệp settings.gradle hoặc build.gradle nào trong toàn bộ thư mục!"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GestureQuest-Arena-Debug-APK
          path: build-output/app-debug.apk
